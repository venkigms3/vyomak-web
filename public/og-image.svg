<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <!-- Sky-to-indigo text gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <!-- Orb glow 1 -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </radialGradient>
    <!-- Orb glow 2 -->
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dot grid overlay -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow orbs -->
  <ellipse cx="280" cy="200" rx="380" ry="320" fill="url(#orb1)"/>
  <ellipse cx="980" cy="460" rx="340" ry="280" fill="url(#orb2)"/>

  <!-- Top accent bar -->
  <rect x="80" y="80" width="60" height="4" rx="2" fill="url(#grad)"/>

  <!-- Available badge -->
  <rect x="80" y="110" width="210" height="34" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="106" cy="127" r="5" fill="#10b981"/>
  <text x="120" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Available for collab</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="900" letter-spacing="-4" fill="#f8fafc">Building</text>

  <!-- Gradient "the future" line -->
  <text x="80" y="340" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="900" letter-spacing="-4" fill="url(#grad)">the future.</text>

  <!-- Subheading -->
  <text x="80" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="300" fill="#94a3b8">Cloud architect &amp; front-end craftsman — elegant, resilient products.</text>

  <!-- Divider line -->
  <line x1="80" y1="460" x2="1120" y2="460" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom: site name -->
  <text x="80" y="510" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Vyomak</text>
  <text x="80" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#475569">vyomak.com</text>

  <!-- Bottom right: tech pills -->
  <rect x="760" y="487" width="100" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="810" y="507" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Next.js</text>

  <rect x="872" y="487" width="80" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="912" y="507" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">React</text>

  <rect x="964" y="487" width="68" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="998" y="507" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">AWS</text>

  <rect x="1044" y="487" width="76" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="1082" y="507" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Azure</text>
</svg>
